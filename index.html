<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Comingo - Обучение</title>
    <style>
        /* Базовые стили и переменные для тем */
        :root {
            --bg-color: #ffffff;
            --bg-secondary: #f7f9fc;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --card-bg: #ffffff;
            --border-color: #e5e7eb;
            --primary-blue: #1c7ed6;
            --nav-bg: #ffffff;
        }

        body.dark-theme {
            --bg-color: #121212;
            --bg-secondary: #1e1e1e;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --card-bg: #2d2d2d;
            --border-color: #374151;
            --primary-blue: #3b82f6;
            --nav-bg: #121212;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
            -webkit-tap-highlight-color: transparent; 
        }

        /* ИЗМЕНЕНИЯ ЗДЕСЬ: прижимаем приложение к верху */
        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            /* align-items: center; <-- Убрали центрирование по вертикали */
            align-items: flex-start; 
            min-height: 100vh;
            color: var(--text-main);
            overflow: hidden; /* Отключаем скролл страницы */
        }

        /* Контейнер приложения */
        .app-container {
            width: 100%;
            max-width: 400px; /* Ограничение для ПК */
            height: 100vh;    /* Занимает всю высоту */
            height: 100dvh;   /* Динамическая высота для мобильных */
            max-height: 900px;/* Максимальная высота для очень больших экранов */
            background-color: var(--bg-color);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- ОБЩИЕ ПРАВИЛА ДЛЯ ЭКРАНОВ --- */
        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
            overflow: hidden; 
        }

        .screen.active {
            display: flex;
        }

        /* =========================================
           ЭКРАН 1 (Стартовый)
           ========================================= */
        #screen-1 {
            justify-content: space-between;
            align-items: center;
            padding: 20px 20px 40px 20px; /* Уменьшили верхний отступ */
            text-align: center;
        }

        .content-1 {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 5vh; /* Немного подняли контент */
            width: 100%;
            flex-grow: 1; 
            justify-content: center; 
        }

        .mascot-photo { width: 240px; height: auto; object-fit: contain; margin-bottom: 15px; display: block; }
        .logo-img { width: 100%; max-width: 280px; height: auto; max-height: 90px; object-fit: contain; margin-bottom: 20px; display: block; }
        .subtitle { font-size: 18px; color: var(--text-muted); line-height: 1.5; max-width: 280px; }

        .start-btn {
            width: 100%;
            padding: 20px;
            background-color: var(--primary-blue);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(28, 126, 214, 0.2);
            flex-shrink: 0;
        }

        /* =========================================
           ЭКРАН 2 (Выбор темы)
           ========================================= */
        #screen-2 { background-color: var(--bg-color); }

        /* Уменьшили верхний отступ у панели с крестиком */
        .top-bar { padding: 10px 20px; display: flex; justify-content: flex-start; flex-shrink: 0; }
        .close-btn { background: none; border: none; cursor: pointer; color: var(--text-muted); }
        .close-btn svg { width: 28px; height: 28px; }

        .main-content-2 { padding: 0 20px; flex-grow: 1; overflow-y: auto; }

        .character-block { display: flex; align-items: center; margin-bottom: 30px; }
        .character-photo { width: 120px; height: auto; max-height: 150px; object-fit: contain; margin-right: 10px; z-index: 2; }

        .speech-bubble {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            position: relative;
            flex-grow: 1; 
        }

        .speech-bubble::before {
            content: '';
            position: absolute;
            left: -12px;
            top: 50%; 
            transform: translateY(-50%) rotate(45deg);
            width: 20px; height: 20px;
            background: var(--card-bg);
            border-left: 2px solid var(--border-color);
            border-bottom: 2px solid var(--border-color);
        }

        .option-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-card.selected {
            border-color: var(--primary-blue);
            background-color: rgba(28, 126, 214, 0.05);
        }
        body.dark-theme .option-card.selected {
            background-color: rgba(59, 130, 246, 0.1);
        }

        .icon-box { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-right: 15px; }
        .icon-purple { background-color: #9b51e0; }
        .icon-blue { background-color: #2d9cdb; }

        .option-title { font-size: 18px; font-weight: 800; color: var(--text-main); }

        .bottom-bar {
            padding: 20px;
            background-color: var(--bg-color);
            border-top: 2px solid var(--border-color);
            flex-shrink: 0;
        }

        .continue-btn {
            width: 100%; padding: 20px;
            background-color: var(--border-color); color: var(--text-muted);
            border: none; border-radius: 16px;
            font-size: 18px; font-weight: 700;
            cursor: not-allowed; text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .continue-btn.active {
            background-color: var(--primary-blue); color: white;
            cursor: pointer; box-shadow: 0 4px 10px rgba(28, 126, 214, 0.2);
        }

        /* =========================================
           ЭКРАН 3 (Задания)
           ========================================= */
        #screen-3 { background-color: var(--bg-secondary); }

        .course-tabs {
            display: flex;
            padding: 10px 20px; 
            background-color: var(--bg-color);
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .tab-btn {
            flex: 1;
            padding: 10px; 
            border-radius: 12px;
            border: 2px solid var(--border-color);
            background: var(--bg-color);
            font-size: 15px; 
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
        }

        .tab-btn.active {
            background-color: var(--primary-blue); color: white; border-color: var(--primary-blue);
        }

        .main-content-3 { padding: 20px; flex-grow: 1; overflow-y: auto; }

        .module-banner {
            background-color: var(--primary-blue);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            margin-bottom: 20px;
        }

        .module-text h3 { font-size: 12px; text-transform: uppercase; opacity: 0.8; margin-bottom: 5px; }
        .module-text h2 { font-size: 22px; font-weight: 800; }

        .vocab-btn {
            display: flex; flex-direction: column; align-items: center; background: rgba(255, 255, 255, 0.15);
            padding: 10px; border-radius: 12px; border: none; color: white; cursor: pointer;
        }
        .vocab-btn svg { margin-bottom: 4px; }
        .vocab-btn span { font-size: 12px; font-weight: 700; }

        .progress-card { background: var(--card-bg); border: 2px solid var(--border-color); border-radius: 16px; padding: 20px; margin-bottom: 30px; }
        .progress-header { display: flex; justify-content: space-between; font-weight: 700; font-size: 14px; color: var(--text-muted); margin-bottom: 15px; }
        .progress-bar-bg { width: 100%; height: 12px; background-color: var(--border-color); border-radius: 6px; overflow: hidden; }
        .progress-bar-fill { width: 5%; height: 100%; background-color: var(--primary-blue); border-radius: 6px; }

        .level-item { display: flex; flex-direction: column; align-items: center; margin-bottom: 30px; text-align: center; }
        .level-circle {
            width: 100px; height: 100px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 36px; font-weight: 800; margin-bottom: 15px; background-color: var(--border-color);
            color: var(--text-muted); border: 6px solid var(--bg-secondary); box-shadow: 0 0 0 4px var(--border-color);
        }
        .level-circle.unlocked { background-color: var(--primary-blue); color: white; box-shadow: 0 0 0 4px rgba(28, 126, 214, 0.3); }
        .level-title { font-size: 20px; font-weight: 800; margin-bottom: 5px; }
        .level-desc { font-size: 14px; color: var(--text-muted); }

        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 20px;
            padding-bottom: max(8px, env(safe-area-inset-bottom));
            background-color: var(--nav-bg);
            border-top: 2px solid var(--border-color);
            flex-shrink: 0; 
            min-height: 60px;
        }

        .nav-btn {
            background: none; border: none; color: var(--text-muted); cursor: pointer;
            padding: 8px;
            display: flex; align-items: center; justify-content: center;
        }

        .nav-btn.active-home {
            background-color: rgba(28, 126, 214, 0.1); color: var(--primary-blue);
            border: 2px solid var(--primary-blue); border-radius: 12px;
        }

        /* =========================================
           МОДАЛЬНОЕ ОКНО НАСТРОЕК
           ========================================= */
        .settings-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4); display: none; align-items: flex-end;
            z-index: 100; opacity: 0; transition: opacity 0.3s ease;
        }
        .settings-overlay.show { display: flex; opacity: 1; }

        .settings-sheet {
            background-color: var(--bg-secondary); width: 100%;
            border-radius: 24px 24px 0 0; padding: 25px 20px 30px 20px;
            transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1);
        }
        .settings-overlay.show .settings-sheet { transform: translateY(0); }

        .settings-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .settings-header h2 { font-size: 26px; font-weight: 800; color: var(--text-main); }
        .close-settings-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 5px; }

        .section-title { font-size: 12px; font-weight: 800; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; margin-bottom: 15px; }
        .theme-options { display: flex; gap: 15px; margin-bottom: 30px; }

        .theme-card {
            flex: 1; background-color: var(--card-bg); border: 2px solid var(--border-color); border-radius: 16px;
            padding: 15px; display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: all 0.2s ease;
        }
        .theme-card.active { border-color: var(--primary-blue); background-color: rgba(28, 126, 214, 0.05); }
        body.dark-theme .theme-card.active { background-color: rgba(59, 130, 246, 0.1); }

        .theme-preview {
            width: 50px; height: 60px; border-radius: 8px; margin-bottom: 10px; border: 2px solid var(--border-color);
            position: relative; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 5px;
        }
        .theme-preview.light { background-color: #ffffff; }
        .theme-preview.dark { background-color: #121212; border-color: #374151; }
        .theme-preview::after { content: ''; width: 25px; height: 6px; background-color: #10b981; border-radius: 3px; }
        .theme-name { font-size: 16px; font-weight: 700; color: var(--text-main); }
        .settings-footer { text-align: center; font-size: 13px; color: #9ca3af; margin-top: 10px; }

    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- ЭКРАН 1: Стартовый -->
        <div id="screen-1" class="screen active">
            <div class="content-1">
                <img src="Сорока.jpg" alt="Сорока" class="mascot-photo" onerror="this.src='https://via.placeholder.com/240x240?text=Фото+Сорока'">
                <img src="логотип.png" alt="Логотип" class="logo-img" onerror="this.src='https://via.placeholder.com/280x90?text=Логотип'">
                <p class="subtitle">Выучи все определения шаг за<br>шагом</p>
            </div>
            <button class="start-btn" onclick="goToScreen('screen-2')">НАЧАТЬ</button>
        </div>

        <!-- ЭКРАН 2: Выбор темы -->
        <div id="screen-2" class="screen">
            <div class="top-bar">
                <button class="close-btn" onclick="resetAndGoBack()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="main-content-2">
                <div class="character-block">
                    <img src="Пахомова.jpg" alt="Пахомова" class="character-photo" onerror="this.src='https://via.placeholder.com/120x150?text=Пахомова'">
                    <div class="speech-bubble">Что вы хотите<br>изучать?</div>
                </div>
                
                <div class="option-card" id="card-methodology" onclick="selectOption(this)">
                    <div class="icon-box icon-purple">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                    </div>
                    <div class="option-title">Методология</div>
                </div>
                
                <div class="option-card" id="card-statistics" onclick="selectOption(this)">
                    <div class="icon-box icon-blue">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                    </div>
                    <div class="option-title">Статистика</div>
                </div>
            </div>
            
            <div class="bottom-bar">
                <button class="continue-btn" id="continue-btn" onclick="proceedToTasks()">ПРОДОЛЖИТЬ</button>
            </div>
        </div>

        <!-- ЭКРАН 3: Методология (Задания) -->
        <div id="screen-3" class="screen">
            <div class="course-tabs">
                <button class="tab-btn active" onclick="switchCourse(this)">Курс 1</button>
                <button class="tab-btn" onclick="switchCourse(this)">Курс 2</button>
            </div>
            
            <div class="main-content-3">
                <div class="module-banner">
                    <div class="module-text">
                        <h3>Методология</h3>
                        <h2>Определения</h2>
                    </div>
                    <button class="vocab-btn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                        <span>Словарь</span>
                    </button>
                </div>
                <div class="progress-card">
                    <div class="progress-header">
                        <span>Освоено терминов</span>
                        <span>0 из 40</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill"></div>
                    </div>
                </div>
                <div class="level-item">
                    <div class="level-circle unlocked">1</div>
                    <div class="level-title">Знакомство</div>
                    <div class="level-desc">Подбери определение к термину</div>
                </div>
                <div class="level-item">
                    <div class="level-circle">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    </div>
                    <div class="level-title">Узнавание</div>
                    <div class="level-desc">Похожие варианты рядом</div>
                </div>
            </div>

            <div class="bottom-nav">
                <button class="nav-btn" onclick="goToScreen('screen-2')">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </button>
                <button class="nav-btn active-home">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                </button>
                <button class="nav-btn" onclick="toggleSettings(true)">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </button>
            </div>
        </div>

        <!-- МОДАЛЬНОЕ ОКНО НАСТРОЕК -->
        <div class="settings-overlay" id="settings-modal" onclick="overlayClick(event)">
            <div class="settings-sheet">
                <div class="settings-header">
                    <h2>Настройки</h2>
                    <button class="close-settings-btn" onclick="toggleSettings(false)">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>
                <div class="section-title">Тема</div>
                <div class="theme-options">
                    <div class="theme-card active" id="theme-light" onclick="setTheme('light')">
                        <div class="theme-preview light"></div>
                        <div class="theme-name">Светлая</div>
                    </div>
                    <div class="theme-card" id="theme-dark" onclick="setTheme('dark')">
                        <div class="theme-preview dark"></div>
                        <div class="theme-name">Тёмная</div>
                    </div>
                </div>
                <div class="settings-footer">
                    замечания и предложения - @wild_abobus
                </div>
            </div>
        </div>

    </div>

    <script>
        let selectedTopic = null;

        function goToScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }

        function selectOption(cardElement) {
            document.querySelectorAll('.option-card').forEach(card => {
                card.classList.remove('selected');
            });
            cardElement.classList.add('selected');
            selectedTopic = cardElement.id;

            const btn = document.getElementById('continue-btn');
            btn.classList.add('active');
            btn.disabled = false;
        }

        function proceedToTasks() {
            if (selectedTopic) {
                goToScreen('screen-3');
            }
        }

        function resetAndGoBack() {
            document.querySelectorAll('.option-card').forEach(card => {
                card.classList.remove('selected');
            });
            selectedTopic = null;
            const btn = document.getElementById('continue-btn');
            btn.classList.remove('active');
            
            goToScreen('screen-1');
        }

        function switchCourse(btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function toggleSettings(show) {
            const modal = document.getElementById('settings-modal');
            if (show) {
                modal.style.display = 'flex';
                setTimeout(() => modal.classList.add('show'), 10);
            } else {
                modal.classList.remove('show');
                setTimeout(() => modal.style.display = 'none', 300);
            }
        }

        function overlayClick(event) {
            if (event.target === document.getElementById('settings-modal')) {
                toggleSettings(false);
            }
        }

        function setTheme(theme) {
            const body = document.body;
            const lightCard = document.getElementById('theme-light');
            const darkCard = document.getElementById('theme-dark');

            if (theme === 'light') {
                body.classList.remove('dark-theme');
                lightCard.classList.add('active');
                darkCard.classList.remove('active');
            } else {
                body.classList.add('dark-theme');
                darkCard.classList.add('active');
                lightCard.classList.remove('active');
            }
        }
